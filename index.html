<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#100e17">
    <meta name="description" content="Compress and share links directly in your browser with URLForge.">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>URLForge</title>
    <link rel="icon" type="image/png" href="./brand.png">
    <link rel="stylesheet" href="/src/web/styles.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./">
          <img class="brand-mark" src="./brand.png" width="32" height="32" alt="">
          <span>URL<strong>Forge</strong></span>
        </a>
        <div class="language-control">
          <label for="language" data-i18n="languageLabel"></label>
          <select id="language">
            <option value="en" data-i18n="languageEn">English</option>
            <option value="pt-BR" data-i18n="languagePt">Português</option>
          </select>
        </div>
      </header>

      <main>
        <section id="app-view" class="app-view">
          <div class="hero">
            <h1 data-i18n="heroTitle">Compress a link.</h1>
            <p data-i18n="heroDescription">Runs entirely in your browser.</p>
          </div>

          <section class="forge-card" aria-labelledby="input-label">
            <div class="workspace">
              <form id="compress-form" class="workspace-input" novalidate>
                <div class="field-heading">
                  <label id="input-label" for="url-input" data-i18n="inputLabel">Original URL</label>
                  <output id="byte-counter" for="url-input"></output>
                </div>
                <textarea id="url-input" rows="3" spellcheck="false" autocomplete="url" autocapitalize="off" inputmode="url" required data-i18n-placeholder="inputPlaceholder" placeholder="https://example.com/path?parameter=value"></textarea>
                <div class="field-tools">
                  <div class="button-row">
                    <button class="button primary" type="submit" data-i18n="compressButton">Compress link</button>
                    <button class="button secondary" id="clear-button" type="button" data-i18n="clearButton">Clear</button>
                  </div>
                  <div class="codec-tools">
                    <label class="codec-control" for="codec">
                      <span data-i18n="codecLabel">Codec</span>
                      <select id="codec">
                        <option value="auto" data-i18n="codecAuto" selected>Automatic</option>
                        <option value="forge">URLForge</option>
                        <option value="hamr">ha.mr</option>
                      </select>
                    </label>
                    <button class="text-button" id="example-button" type="button" data-i18n="exampleButton">Try an example</button>
                  </div>
                </div>
              </form>
              <section id="result" class="workspace-output" aria-labelledby="result-title" hidden>
                <div class="field-heading">
                  <h2 id="result-title" data-i18n="shortUrlLabel">Compressed link</h2>
                </div>
                <textarea id="short-url" readonly rows="2" spellcheck="false" aria-labelledby="result-title"></textarea>
                <dl class="metrics">
                  <div><dt data-i18n="finalCharsLabel"></dt><dd id="final-chars"></dd></div>
                  <div><dt data-i18n="savedCharsLabel"></dt><dd id="saved-chars"></dd></div>
                </dl>
                <div class="button-row result-actions">
                  <button class="button primary" id="copy-button" type="button" data-i18n="copyButton"></button>
                  <button class="button secondary" id="open-button" type="button" data-i18n="openButton"></button>
                  <button class="button secondary" id="qr-button" type="button" data-i18n="qrButton"></button>
                </div>
                <p id="qr-limit-message" class="inline-message" hidden></p>
              </section>
            </div>
            <div id="status" class="status" role="status" aria-live="polite" hidden></div>
          </section>

          <section id="qr-panel" class="qr-card" aria-labelledby="qr-title" hidden>
            <div>
              <h2 id="qr-title" data-i18n="qrTitle"></h2>
              <p data-i18n="qrDescription"></p>
            </div>
            <img id="qr-preview" alt="" data-i18n-alt="qrAlt">
            <div class="qr-actions">
              <label for="qr-size" data-i18n="qrSizeLabel"></label>
              <select id="qr-size"><option value="512" data-i18n="qrSize512"></option><option value="1024" data-i18n="qrSize1024"></option></select>
              <button class="button secondary" id="download-svg" type="button" data-i18n="qrDownloadSvg"></button>
              <button class="button secondary" id="download-png" type="button" data-i18n="qrDownloadPng"></button>
            </div>
          </section>
        </section>

        <section id="redirect-view" class="redirect-card" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <h1 id="redirect-title" data-i18n="resolvingTitle"></h1>
          <p id="redirect-description" data-i18n="resolvingDescription"></p>
          <a id="redirect-back" class="button secondary" href="./" data-i18n="redirectBack" hidden></a>
        </section>
      </main>

      <footer>
        <a href="./privacy.html" data-i18n="footerPrivacy"></a>
        <a href="https://github.com/luizbizzio/urlforge" data-i18n="footerSource"></a>
      </footer>
    </div>
    <script type="module" src="/src/web/app.js"></script>
  </body>
</html>
